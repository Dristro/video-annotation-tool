[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vat"
dynamic = ["version"]
description = "Lightweight macOS video annotation tool: mark cuts and labels on videos without touching the raw files."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "PySide6>=6.7",
    "python-mpv>=1.0.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.4",
]
# Everything needed to build the macOS .app bundle (scripts/build_app.sh).
build = [
    "pyinstaller>=6.10",
]

[project.scripts]
vat = "vat.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "vat.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"
