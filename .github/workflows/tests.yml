name: Tests

on:
  push:
    branches: [main, stable]
  pull_request:

jobs:
  pytest:
    # macOS runner, not ubuntu: mpv_player.py's libmpv bootstrap workaround
    # (see CLAUDE.md's "Known environment issue: libmpv on macOS Tahoe")
    # looks for Homebrew's mac library paths specifically, and vat.ui.*
    # modules import it transitively even though no test ever constructs a
    # real MpvPlayer -- so libmpv still has to be importable for the test
    # suite to collect at all.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies (mpv, ffmpeg)
        run: brew install mpv ffmpeg

      - name: Install vat with dev dependencies
        run: python3 -m pip install -e ".[dev]"

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python3 -m pytest
